# blog.jimmyhoughjr.net is a courtesy alias — the blog lives under the apex
# (SEO authority stays on one host). nginx picks this block by Host header;
# the default block keeps serving the apex site.
server {
    listen 80;
    server_name blog.jimmyhoughjr.net;
    return 301 https://jimmyhoughjr.net/blog$request_uri;
}
